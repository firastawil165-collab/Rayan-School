<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#C9E9FF">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Rayan School</title>
<style>
  :root{
    --ink:#101A2E; --ink-soft:#1B2942; --chalk:#EAF0FF; --mute:#8090B0; --line:#25334F;
    --pad: clamp(16px, 5vw, 32px);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  /* the page scrolls the normal way (a fixed, self-scrolling body does not
     scroll reliably on iPad Safari, which hid the lower cards) */
  html{min-height:100%; background:#0B1120;}
  html.appOpen, html.appOpen body{overflow:hidden; height:100%;}
  body{
    margin:0; min-height:100vh; min-height:100dvh;
    -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
    background:radial-gradient(120% 80% at 50% 0%, #1B2942 0%, #101A2E 60%, #0B1120 100%) fixed;
    color:var(--chalk);
    font-family: ui-rounded, "SF Pro Rounded", "Segoe UI", Roboto, system-ui, sans-serif;
    display:flex; flex-direction:column; align-items:center; justify-content:flex-start;
    padding: max(var(--pad), env(safe-area-inset-top)) var(--pad) max(var(--pad), env(safe-area-inset-bottom));
  }

  #menu{
    width:100%; max-width:520px; margin:auto 0;   /* centres when it fits, scrolls when it does not */
    display:flex; flex-direction:column; gap: clamp(14px, 2.8vh, 30px);
  }
  #menu header{text-align:center;}
  #menu h1{margin:0; font-size:clamp(1.9rem, 7vw, 2.6rem); font-weight:800; letter-spacing:-.01em;}
  #menu header p{margin:4px 0 0; color:var(--mute); font-size:1rem; font-weight:600;}

  .sections{display:flex; flex-direction:column; gap: clamp(14px, 2.6vh, 28px);}
  .section{display:flex; flex-direction:column; gap:10px; min-width:0;}
  .section h2{
    margin:0 4px; display:flex; align-items:center; gap:12px;
    font-size:.8rem; font-weight:800; letter-spacing:.16em; text-transform:uppercase; color:var(--mute);
  }
  .section h2::after{content:""; flex:1; height:1px; background:var(--line);}
  .grid{display:grid; grid-template-columns:1fr; gap:10px;}

  /* phone: big full-width rows */
  .card{
    border:0; cursor:pointer; touch-action:manipulation; font:inherit; color:var(--card-ink);
    display:flex; align-items:center; gap:14px; text-align:left;
    min-height:clamp(74px, 10.4vh, 100px); padding:10px 14px 10px 10px;
    border-radius:24px; background:var(--card-bg);
    box-shadow:0 10px 0 -5px rgba(0,0,0,.28), 0 22px 40px -18px rgba(0,0,0,.6);
    transition: transform .12s ease;
  }
  .card:active{ transform:translateY(4px) scale(.985); }
  .card .art{
    flex:0 0 auto; width:clamp(56px, 8.2vh, 76px); aspect-ratio:1; border-radius:18px;
    display:flex; align-items:center; justify-content:center; background:rgba(255,255,255,.36);
    font-size:clamp(1.35rem, 3.3vh, 1.85rem); font-weight:900; letter-spacing:-.02em; line-height:1;
    white-space:nowrap;
  }
  .card .art.sm{font-size:clamp(.95rem, 2.3vh, 1.25rem); letter-spacing:0;}
  .card .art u{text-decoration:none; color:#1461C4; box-shadow:inset 0 -3px 0 rgba(20,97,196,.4);}
  .card .text{display:flex; flex-direction:column; gap:3px; min-width:0;}
  .card .label{font-size:clamp(1.25rem, 3vh, 1.5rem); font-weight:800; line-height:1.1;}
  .card .desc{font-size:.85rem; font-weight:600; opacity:.72; line-height:1.25;}
  .card .go{margin-left:auto; flex:0 0 auto; width:22px; height:22px; opacity:.45;}

  #cardLetters  { --card-bg:#7B8CFF; --card-ink:#0D1240; }
  #cardWords    { --card-bg:#FF9F6E; --card-ink:#3A1400; }
  #cardSentences{ --card-bg:#F2C14E; --card-ink:#2E2000; }
  #cardNumbers  { --card-bg:#B983FF; --card-ink:#230A45; }
  #cardMath     { --card-bg:#4ECB8D; --card-ink:#062A18; }

  #more{margin:0; color:var(--mute); font-size:.8rem; font-weight:600; text-align:center; opacity:.55;}

  /* phone on its side: the two subjects side by side, compact rows */
  @media (orientation: landscape) and (max-height:520px){
    #menu{max-width:860px;}
    .sections{display:grid; grid-template-columns:3fr 2fr; gap:20px; align-items:start;}
    .card{min-height:64px;}
    .card .art{width:50px; font-size:1.25rem;}
    .card .art.sm{font-size:.9rem;}
    .card .label{font-size:1.15rem;}
    .card .desc{font-size:.75rem;}
  }

  /* iPad portrait and up: big tiles */
  @media (min-width:700px) and (min-height:600px){
    #menu{max-width:780px; gap:clamp(24px, 3.6vh, 44px);}
    #menu h1{font-size:3rem;}
    #menu header p{font-size:1.15rem;}
    .section{gap:14px;}
    .section h2{font-size:.95rem;}
    .grid{gap:16px;}
    .reading .grid{grid-template-columns:repeat(3, 1fr);}
    .maths .grid{grid-template-columns:repeat(2, 1fr);}
    .card{
      flex-direction:column; justify-content:center; text-align:center; gap:16px;
      min-height:clamp(230px, 26vh, 320px); padding:22px 14px; border-radius:32px;
      box-shadow:0 14px 0 -6px rgba(0,0,0,.28), 0 28px 50px -20px rgba(0,0,0,.6);
    }
    .card .text{align-items:center; gap:6px;}
    .card .art{width:clamp(100px, 11vh, 128px); border-radius:28px; font-size:clamp(2.4rem, 4.6vh, 3rem);}
    .card .art.sm{font-size:clamp(1.6rem, 3vh, 2rem);}
    .card .art u{box-shadow:inset 0 -5px 0 rgba(20,97,196,.4);}
    .card .label{font-size:1.65rem;}
    .card .desc{font-size:1rem; max-width:22ch; min-height:2.5em;}
    .card .go{display:none;}
    #more{font-size:.95rem;}
  }
  /* iPad landscape: Reading and Maths side by side */
  @media (orientation: landscape) and (min-width:1000px) and (min-height:600px){
    #menu{max-width:1120px;}
    .sections{display:grid; grid-template-columns:3fr 2fr; gap:28px;}
    .card{min-height:clamp(260px, 42vh, 360px);}
  }

  #frameWrap{ position:fixed; inset:0; z-index:10; display:none; background:#0B1120; }
  #frameWrap.open{ display:block; }
  #appFrame{ position:absolute; inset:0; width:100%; height:100%; border:0; background:#0B1120; }

  /* the way back to the menu: a solid, easy-to-find button */
  #btnHome{
    position:fixed; z-index:11;
    top: max(10px, env(safe-area-inset-top)); left: max(10px, env(safe-area-inset-left));
    width:44px; height:44px; padding:0; display:grid; place-items:center;
    border:1.5px solid rgba(255,255,255,.28); border-radius:14px; cursor:pointer; touch-action:manipulation;
    background:rgba(11,17,32,.78); color:#fff; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    box-shadow:0 6px 18px -6px rgba(0,0,0,.6);
  }
  #btnHome svg{width:24px; height:24px;}
  #btnHome:active{ transform:translateY(1px) scale(.96); }
  @media (min-width:700px) and (min-height:600px){
    #btnHome{width:54px; height:54px; border-radius:17px; top:max(14px, env(safe-area-inset-top)); left:max(14px, env(safe-area-inset-left));}
    #btnHome svg{width:28px; height:28px;}
  }

  @media (prefers-reduced-motion: reduce){ *{transition-duration:.01ms !important;} }

  /* ===== friendly light theme ===== */
  html{background:#FFF3DB;}
  body{background:linear-gradient(180deg,#C9E9FF 0%,#E6F5FF 38%,#FFF3DB 100%) fixed; color:#2A2F4A;}
  #menu header p, #more{color:#767C98;}
  #menu h1{color:#25307A;}
  .section h2{color:#767C98;} .section h2::after{background:#E3D6C0;}
  .card{box-shadow:0 7px 0 var(--edge), 0 18px 30px -16px rgba(90,64,20,.4);}
  .card:active{box-shadow:0 2px 0 var(--edge);}
  .card .art{background:rgba(255,255,255,.55);}
  #cardLetters  { --card-bg:#7C93FF; --card-ink:#14205E; --edge:#5468D8; }
  #cardWords    { --card-bg:#FF9A6B; --card-ink:#4A1A00; --edge:#DD7646; }
  #cardSentences{ --card-bg:#FFCB45; --card-ink:#3D2A00; --edge:#DDA21C; }
  #cardNumbers  { --card-bg:#B98BFF; --card-ink:#2C0F57; --edge:#9264E0; }
  #cardMath     { --card-bg:#4FD08F; --card-ink:#073A21; --edge:#2FA86C; }
  #frameWrap, #appFrame{background:#FFF3DB;}
  #btnHome{background:#FFFFFF; color:#2A2F4A; border:0; box-shadow:0 4px 0 #DCCDB4, 0 8px 16px -8px rgba(90,64,20,.4);}
  #btnHome:active{box-shadow:0 1px 0 #DCCDB4;}
</style>
</head>
<body>

<div id="menu">
  <header>
    <h1>Rayan School</h1>
    <p>What shall we practise?</p>
  </header>
  <div class="sections">
    <section class="section reading" aria-label="Reading">
      <h2>Reading</h2>
      <div class="grid">
      <button class="card" id="cardLetters" type="button">
        <span class="art" aria-hidden="true">Aa</span>
        <span class="text"><span class="label">Letters</span><span class="desc">Trace, listen &amp; say</span></span>
        <svg class="go" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
      </button>
      <button class="card" id="cardWords" type="button">
        <span class="art" aria-hidden="true"><u>c</u>at</span>
        <span class="text"><span class="label">Words</span><span class="desc">Tap a picture, hear the word</span></span>
        <svg class="go" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
      </button>
      <button class="card" id="cardSentences" type="button">
        <span class="art sm" aria-hidden="true">I can.</span>
        <span class="text"><span class="label">Sentences</span><span class="desc">Read along, word by word</span></span>
        <svg class="go" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
      </button>
      </div>
    </section>
    <section class="section maths" aria-label="Maths">
      <h2>Maths</h2>
      <div class="grid">
      <button class="card" id="cardNumbers" type="button">
        <span class="art" aria-hidden="true">123</span>
        <span class="text"><span class="label">Numbers</span><span class="desc">Tap for a new number 1–10</span></span>
        <svg class="go" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
      </button>
      <button class="card" id="cardMath" type="button">
        <span class="art" aria-hidden="true">2+3</span>
        <span class="text"><span class="label">Adding</span><span class="desc">Count the fingers, pick the answer</span></span>
        <svg class="go" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
      </button>
      </div>
    </section>
  </div>
  <p id="more">More to come soon</p>
</div>

<div id="frameWrap">
  <button id="btnHome" type="button" title="Back" aria-label="Back to menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"/><path d="M11 5l-7 7 7 7"/></svg></button>
  <iframe id="appFrame" title="App"></iframe>
</div>

  function b64ToUtf8(b64){
    const bin = atob(b64);
    let percentEncoded = '';
    for (let i = 0; i < bin.length; i++){
      percentEncoded += '%' + ('00' + bin.charCodeAt(i).toString(16)).slice(-2);
    }
    return decodeURIComponent(percentEncoded);
  }

  const frameWrap = document.getElementById('frameWrap');
  const appFrame = document.getElementById('appFrame');
  const menu = document.getElementById('menu');

  function openApp(b64){
    appFrame.srcdoc = b64ToUtf8(b64);
    frameWrap.classList.add('open');
    document.documentElement.classList.add('appOpen');
  }
  function closeApp(){
    frameWrap.classList.remove('open');
    document.documentElement.classList.remove('appOpen');
    appFrame.srcdoc = 'about:blank';
  }

  document.getElementById('cardNumbers').addEventListener('click', () => openApp(NUMBERS_B64));
  document.getElementById('cardLetters').addEventListener('click', () => openApp(LETTERS_B64));
  document.getElementById('cardWords').addEventListener('click', () => openApp(WORDS_B64));
  document.getElementById('cardSentences').addEventListener('click', () => openApp(SENTENCES_B64));
  document.getElementById('cardMath').addEventListener('click', () => openApp(MATH_B64));
  /* a real back button: first step back inside the app (close the open panel
   or game); only when the app is on its main screen do we leave to the menu */
  document.getElementById('btnHome').addEventListener('click', () => {
    let handled = false;
    try{
      const w = appFrame.contentWindow;
      if (w && typeof w.appBack === 'function') handled = !!w.appBack();
    }catch(e){}
    if (!handled) closeApp();
  });

  document.addEventListener('gesturestart', e => e.preventDefault());
</script>
