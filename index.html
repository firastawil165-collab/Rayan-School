<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#101A2E">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Rayan School</title>
<style>
  :root{
    --ink:#101A2E; --ink-soft:#1B2942; --chalk:#EAF0FF; --mute:#7E8CAB;
    --pad: clamp(16px, 5vw, 32px);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  /* the page scrolls the normal way (a fixed, self-scrolling body does not
     scroll reliably on iPad Safari, which hid the lower cards) */
  html{min-height:100%; background:#0B1120;}
  html.appOpen, html.appOpen body{overflow:hidden; height:100%;}
  body{
    margin:0; min-height:100vh; min-height:100dvh;
    -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
    background:radial-gradient(120% 80% at 50% 0%, #1B2942 0%, #101A2E 60%, #0B1120 100%) fixed;
    color:var(--chalk);
    font-family: ui-rounded, "SF Pro Rounded", "Segoe UI", Roboto, system-ui, sans-serif;
    display:flex; flex-direction:column;
    align-items:center; justify-content:flex-start;
    padding: max(var(--pad), env(safe-area-inset-top)) var(--pad) max(var(--pad), env(safe-area-inset-bottom));
  }

  #menu{
    width:100%; max-width:560px; margin:auto 0;   /* centres when it fits, scrolls when it does not */
    display:flex; flex-direction:column; align-items:center;
    gap: clamp(16px, 3.4vh, 40px);
  }
  #menu h1{
    margin:0; text-align:center;
    font-size:clamp(1.8rem, 7vw, 2.6rem); font-weight:800; letter-spacing:-0.01em;
  }
  #menu p.sub{
    margin:-1.2rem 0 0; text-align:center; color:var(--mute);
    font-size:.95rem; font-weight:600; letter-spacing:.04em;
  }
  #cards{
    display:grid; grid-template-columns:1fr 1fr; gap:12px; width:100%;
  }
  #cards .card:last-child:nth-child(odd){ grid-column:1 / -1; }

  .card{
    border:0; cursor:pointer; touch-action:manipulation;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:8px; padding: clamp(16px,3vh,34px) 12px;
    border-radius:26px; font:inherit; color:var(--card-ink);
    box-shadow:0 14px 0 -6px rgba(0,0,0,.28), 0 26px 50px -18px rgba(0,0,0,.6);
    transition: transform .12s ease;
  }
  .card:active{ transform:translateY(4px) scale(.98); }
  .card .emoji{ font-size:clamp(2rem, 8vw, 3rem); line-height:1; }
  .card .label{ font-size:clamp(1rem, 3.6vw, 1.3rem); font-weight:800; }
  .card .desc{ font-size:.72rem; font-weight:600; opacity:.75; text-align:center; }
  #cardNumbers{ background:#FFB627; --card-ink:#2A1B00; color:#2A1B00; }
  #cardLetters{ background:#7B8CFF; --card-ink:#0D1240; color:#0D1240; }
  #cardWords{ background:#FF9F6E; --card-ink:#3A1400; color:#3A1400; }
  #cardMath{ background:#4ECB8D; --card-ink:#062A18; color:#062A18; }
  #cardSentences{ background:#F2C14E; --card-ink:#2E2000; color:#2E2000; }

  /* landscape iPad and other wide, short screens: three across so it all fits */
  @media (orientation: landscape) and (min-width: 700px){
    #menu{ max-width:900px; }
    #cards{ grid-template-columns:repeat(6, 1fr); }
    #cards .card{ grid-column:span 2; }
    #cards .card:nth-child(n+4),
    #cards .card:last-child:nth-child(odd){ grid-column:span 3; }   /* last row: two wide cards */
  }
  @media (orientation: landscape) and (min-width: 700px) and (max-height: 620px){
    .card{ padding:14px 10px; gap:5px; }
    .card .emoji{ font-size:2.2rem; }
  }

  #more{
    color:var(--mute); font-size:.78rem; font-weight:600; text-align:center; opacity:.6;
  }

  #frameWrap{
    position:fixed; inset:0; z-index:10; display:none;
    background:#0B1120;
  }
  #frameWrap.open{ display:block; }
  #appFrame{
    position:absolute; inset:0; width:100%; height:100%; border:0; background:#0B1120;
  }
  #btnHome{
    position:fixed; z-index:11;
    top: max(14px, env(safe-area-inset-top));
    left: max(14px, env(safe-area-inset-left));
    border:0; border-radius:999px; cursor:pointer; touch-action:manipulation;
    background:rgba(16,26,46,.75); color:#EAF0FF; backdrop-filter: blur(6px);
    font:inherit; font-size:.85rem; font-weight:700;
    padding:9px 13px; display:flex; align-items:center; gap:6px;
    box-shadow:0 6px 20px -6px rgba(0,0,0,.6);
  }
  #btnHome:active{ transform:translateY(1px); }

  @media (prefers-reduced-motion: reduce){ *{transition-duration:.01ms !important;} }

  @media (min-width:700px) and (min-height:600px){
    #menu p.sub{font-size:1.05rem;}
    .card .desc{font-size:.85rem;}
    #btnHome{font-size:1.05rem; padding:11px 16px;}
    #more{font-size:.9rem;}
  }
</style>
</head>
<body>

<div id="menu">
  <h1>Rayan School</h1>
  <p class="sub">PICK SOMETHING TO PRACTISE</p>
  <div id="cards">
    <button class="card" id="cardNumbers" type="button">
      <span class="emoji">🔢</span>
      <span class="label">Numbers</span>
      <span class="desc">Tap for a new number 1–10</span>
    </button>
    <button class="card" id="cardLetters" type="button">
      <span class="emoji">🔤</span>
      <span class="label">Letters</span>
      <span class="desc">Trace, listen &amp; say</span>
    </button>
    <button class="card" id="cardWords" type="button">
      <span class="emoji">🖼️</span>
      <span class="label">Words</span>
      <span class="desc">Tap a picture, hear the word</span>
    </button>
    <button class="card" id="cardSentences" type="button">
      <span class="emoji">📖</span>
      <span class="label">Sentences</span>
      <span class="desc">Read along, word by word</span>
    </button>
    <button class="card" id="cardMath" type="button">
      <span class="emoji">➕</span>
      <span class="label">Adding</span>
      <span class="desc">Count the fingers, pick the answer</span>
    </button>
  </div>
  <p id="more">More to come soon</p>
</div>

<div id="frameWrap">
  <button id="btnHome" type="button" title="Menu" aria-label="Menu">⌂</button>
  <iframe id="appFrame" title="App"></iframe>
</div>

  function b64ToUtf8(b64){
    const bin = atob(b64);
    let percentEncoded = '';
    for (let i = 0; i < bin.length; i++){
      percentEncoded += '%' + ('00' + bin.charCodeAt(i).toString(16)).slice(-2);
    }
    return decodeURIComponent(percentEncoded);
  }

  const frameWrap = document.getElementById('frameWrap');
  const appFrame = document.getElementById('appFrame');
  const menu = document.getElementById('menu');

  function openApp(b64){
    appFrame.srcdoc = b64ToUtf8(b64);
    frameWrap.classList.add('open');
    document.documentElement.classList.add('appOpen');
  }
  function closeApp(){
    frameWrap.classList.remove('open');
    document.documentElement.classList.remove('appOpen');
    appFrame.srcdoc = 'about:blank';
  }

  document.getElementById('cardNumbers').addEventListener('click', () => openApp(NUMBERS_B64));
  document.getElementById('cardLetters').addEventListener('click', () => openApp(LETTERS_B64));
  document.getElementById('cardWords').addEventListener('click', () => openApp(WORDS_B64));
  document.getElementById('cardSentences').addEventListener('click', () => openApp(SENTENCES_B64));
  document.getElementById('cardMath').addEventListener('click', () => openApp(MATH_B64));
  document.getElementById('btnHome').addEventListener('click', closeApp);

  document.addEventListener('gesturestart', e => e.preventDefault());
</script>
